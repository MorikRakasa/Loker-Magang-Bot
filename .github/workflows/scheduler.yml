name: Loker & Magang Discord Bot

on:
  schedule:
    # Jalan setiap 30 menit (bisa diubah menjadi '0 * * * *' untuk 60 menit)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: write      # perlu untuk auto-commit log posted_tweets.json

# Hindari tumpang tindih antar-jadwal
concurrency:
  group: loker-magang-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_LOKER: ${{ secrets.DISCORD_WEBHOOK_LOKER }}
          DISCORD_WEBHOOK_MAGANG: ${{ secrets.DISCORD_WEBHOOK_MAGANG }}
          ROLE_ID_LOKER: ${{ secrets.ROLE_ID_LOKER }}
          ROLE_ID_MAGANG: ${{ secrets.ROLE_ID_MAGANG }}
        run: python main.py

      - name: Auto Commit Log Database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add posted_tweets.json
          git commit -m "Update posted_tweets.json log [skip ci]" || exit 0
          git push