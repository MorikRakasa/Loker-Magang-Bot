name: Xcancel Discord Bot 247

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          DISCORD_WEBHOOK_LOKER: ${{ secrets.DISCORD_WEBHOOK_LOKER }}
          DISCORD_WEBHOOK_MAGANG: ${{ secrets.DISCORD_WEBHOOK_MAGANG }}
          ROLE_ID_LOKER: ${{ secrets.ROLE_ID_LOKER }}
          ROLE_ID_MAGANG: ${{ secrets.ROLE_ID_MAGANG }}
        run: python main.py

      - name: Auto Commit Log Database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add posted_tweets.json
          git commit -m "Update posted_tweets.json log [skip ci]" || exit 0
          git push
