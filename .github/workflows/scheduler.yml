name: X (Twitter) Loker & Magang Automation

on:
  schedule:
    - cron: '0 */3 * * *' # Berjalan setiap 3 jam
  workflow_dispatch:      # Mengizinkan eksekusi manual (Tombol "Run workflow")

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Wajib: Agar Actions bisa melakukan Git Commit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Main Script
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          WEBHOOK_LOKER: ${{ secrets.WEBHOOK_LOKER }}
          WEBHOOK_MAGANG: ${{ secrets.WEBHOOK_MAGANG }}
          ROLE_ID_LOKER: ${{ secrets.ROLE_ID_LOKER }}
          ROLE_ID_MAGANG: ${{ secrets.ROLE_ID_MAGANG }}
        run: python main.py

      - name: Auto-Commit Log JSON (Prevent Duplicates)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posted_tweets.json
          # Commit hanya jika ada perubahan pada posted_tweets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posted_tweets.json log" && git push)
